name: Provider Plans

on:
  schedule:
    # Safety-net: ein täglicher Lauf (~20:28 UTC). Der Haupt-Scrape kann zusätzlich
    # per Server-Cron über workflow_dispatch getriggert werden.
    - cron: "28 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set safe git directory for container
        run: git config --global --add safe.directory '*'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test scrapers & formulas
        run: pnpm test

      - name: Scrape prices
        run: pnpm scrape

      - name: Build
        run: pnpm build

      - name: Commit data changes
        id: commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git config --global --add safe.directory /github/workspace || true
          echo "pwd=$(pwd) GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la
          ls -la .git 2>&1 | head -20
          git status --porcelain 2>&1 | head -20
          if git diff --quiet data src/vendors; then
            echo "no data changes, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data src/vendors
            git commit -m "chore: update prices $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gh CLI for releases (if not in image)
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh not found, installing..."
            apt-get update -qq
            apt-get install -y -qq gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null && apt-get update -qq && apt-get install -y -qq gh)
            gh --version
          else
            echo "gh already available: $(gh --version | head -1)"
          fi

      - name: Ensure release for changelog days
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-release.mjs --all

      - name: Check changelog/release sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-sync.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5